<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Disbursement Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .loader {
      border-top-color: #3b82f6;
      animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
    <!-- Header -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-6 text-white text-center">
      <h1 class="text-2xl font-bold tracking-tight">Gift Disbursement Form</h1>
      <p class="text-blue-100 text-sm mt-1">Record gift distribution with clear photo <br> during retailer receiving the gift</p>
    </div>

    <!-- Alert Banner -->
    <div id="alertBox" class="hidden p-4 text-sm font-medium text-center"></div>

    <!-- Form Container -->
    <form id="disbursementForm" class="p-6 space-y-5">
      
      <!-- Unit Selection -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Unit</label>
        <select id="unitSelect" required class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 outline-none transition">
          <option value="">Loading Data...</option>
        </select>
      </div>

      <!-- Territory Selection -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Territory</label>
        <select id="territorySelect" required disabled class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 outline-none transition disabled:bg-slate-100 disabled:cursor-not-allowed">
          <option value="">Select Territory</option>
        </select>
      </div>

      <!-- Retail Shop Selection -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Retail Shop (Name - Mobile)</label>
        <select id="retailSelect" required disabled class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 outline-none transition disabled:bg-slate-100 disabled:cursor-not-allowed">
          <option value="">Select Retail Shop</option>
        </select>
      </div>

      <!-- Gift Details Card -->
      <div id="itemDetailsCard" class="hidden bg-indigo-50 border border-indigo-100 rounded-xl p-4 space-y-3">
        <div class="flex justify-between items-center text-sm border-b border-indigo-100 pb-2">
          <span class="text-indigo-600 font-medium">Winning Slab</span>
          <span id="winningSlab" class="font-bold text-slate-800">-</span>
        </div>
        <div class="flex justify-between items-center text-sm">
          <span class="text-indigo-600 font-medium">Final Item</span>
          <span id="finalItem" class="font-bold text-slate-800">-</span>
        </div>
      </div>

      <!-- Disbursement Date -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Disbursement Date</label>
        <input type="date" id="disbursementDate" required class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 block p-3 outline-none transition" />
      </div>

      <!-- Camera Capture Input -->
      <div>
        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Take Photo Proof</label>
        <div class="flex items-center justify-center w-full">
          <label for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
            <div class="flex flex-col items-center justify-center pt-5 pb-6">
              <i data-lucide="camera" class="w-8 h-8 mb-2 text-blue-600"></i>
              <p class="text-sm text-slate-600"><span class="font-semibold">Tap to Open Camera</span></p>
              <p id="fileNameDisplay" class="text-xs text-emerald-600 font-medium mt-1"></p>
            </div>
            <!-- STRICT CAMERA TRIGGER ONLY -->
            <input id="fileInput" type="file" accept="image/*" capture="environment" required class="hidden" />
          </label>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full text-white bg-blue-600 hover:bg-blue-700 focus:ring-4 focus:ring-blue-300 font-semibold rounded-lg text-sm px-5 py-3.5 transition flex items-center justify-center space-x-2">
        <span>Submit Disbursement</span>
      </button>
    </form>
  </div>

  <script>
    // REPLACE WITH YOUR PUBLISHED APPS SCRIPT WEB APP URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxoirrYK6vJkuLu0Y9wszhHxPkW8F3mtPJvs2Y_mhcAKoBMiSqLWdorenGjeRn-EUWm/exec";

    let db = {
      units: [],
      territoriesMap: {},
      retailersMap: {}
    };

    let currentRetailersList = [];
    let selectedRetailer = null;

    lucide.createIcons();

    const unitSelect = document.getElementById("unitSelect");
    const territorySelect = document.getElementById("territorySelect");
    const retailSelect = document.getElementById("retailSelect");
    const itemCard = document.getElementById("itemDetailsCard");
    const winningSlab = document.getElementById("winningSlab");
    const finalItem = document.getElementById("finalItem");
    const fileInput = document.getElementById("fileInput");
    const fileNameDisplay = document.getElementById("fileNameDisplay");
    const form = document.getElementById("disbursementForm");
    const alertBox = document.getElementById("alertBox");
    const submitBtn = document.getElementById("submitBtn");

    document.getElementById("disbursementDate").valueAsDate = new Date();

    document.addEventListener("DOMContentLoaded", () => {
      loadInitialData();
    });

    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length > 0) {
        fileNameDisplay.textContent = "Photo Captured: " + e.target.files[0].name;
      }
    });

    // Single Network Call for instant local filtering
    function loadInitialData() {
      fetch(`${SCRIPT_URL}?action=getInitialData`)
        .then(res => res.json())
        .then(data => {
          db = data;
          populateUnits();
        })
        .catch(err => {
          unitSelect.innerHTML = '<option value="">Failed to Load Data</option>';
        });
    }

    function populateUnits() {
      unitSelect.innerHTML = '<option value="">Select Unit</option>';
      if (db.units && db.units.length > 0) {
        db.units.forEach(unit => {
          unitSelect.innerHTML += `<option value="${unit}">${unit}</option>`;
        });

        // Remember selection from LocalStorage
        const savedUnit = localStorage.getItem("selected_unit");
        if (savedUnit && db.units.includes(savedUnit)) {
          unitSelect.value = savedUnit;
          populateTerritories(savedUnit);
        }
      } else {
        unitSelect.innerHTML = '<option value="">No Units Available</option>';
      }
    }

    unitSelect.addEventListener("change", () => {
      const unit = unitSelect.value;
      localStorage.setItem("selected_unit", unit);
      localStorage.removeItem("selected_territory");

      territorySelect.disabled = true;
      retailSelect.disabled = true;
      itemCard.classList.add("hidden");

      if (unit) populateTerritories(unit);
    });

    // Instant local filtering for Territory
    function populateTerritories(unit) {
      const territories = db.territoriesMap[unit] || [];
      territorySelect.innerHTML = '<option value="">Select Territory</option>';
      
      territories.forEach(ter => {
        territorySelect.innerHTML += `<option value="${ter}">${ter}</option>`;
      });

      territorySelect.disabled = false;

      // Remember selection from LocalStorage
      const savedTerritory = localStorage.getItem("selected_territory");
      if (savedTerritory && territories.includes(savedTerritory)) {
        territorySelect.value = savedTerritory;
        populateRetailers(unit, savedTerritory);
      }
    }

    territorySelect.addEventListener("change", () => {
      const unit = unitSelect.value;
      const territory = territorySelect.value;
      localStorage.setItem("selected_territory", territory);

      retailSelect.disabled = true;
      itemCard.classList.add("hidden");

      if (territory) populateRetailers(unit, territory);
    });

    // Instant local filtering for Pending Retailers
    function populateRetailers(unit, territory) {
      const key = `${unit}|${territory}`;
      currentRetailersList = db.retailersMap[key] || [];

      retailSelect.innerHTML = '<option value="">Select Retail Shop</option>';
      currentRetailersList.forEach((ret, index) => {
        retailSelect.innerHTML += `<option value="${index}">${ret.displayText}</option>`;
      });

      retailSelect.disabled = false;
    }

    retailSelect.addEventListener("change", () => {
      const index = retailSelect.value;
      if (index !== "") {
        selectedRetailer = currentRetailersList[index];
        winningSlab.textContent = selectedRetailer.winningSlab || "N/A";
        finalItem.textContent = selectedRetailer.finalItem || "N/A";
        itemCard.classList.remove("hidden");
      } else {
        selectedRetailer = null;
        itemCard.classList.add("hidden");
      }
    });

    // Compress Image Client-Side for Fast Uploads
    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 1000;
            const MAX_HEIGHT = 1000;
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > MAX_WIDTH) {
                height *= MAX_WIDTH / width;
                width = MAX_WIDTH;
              }
            } else {
              if (height > MAX_HEIGHT) {
                width *= MAX_HEIGHT / height;
                height = MAX_HEIGHT;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            
            // Output compressed JPEG image
            resolve(canvas.toDataURL("image/jpeg", 0.7));
          };
        };
      });
    }

    // Form Submit
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!selectedRetailer || !fileInput.files[0]) {
        showAlert("Please complete all required fields and capture a photo.", "bg-red-100 text-red-700");
        return;
      }

      setLoading(true);

      try {
        const compressedBase64 = await compressImage(fileInput.files[0]);

        const payload = {
          rowIndex: selectedRetailer.rowIndex,
          unit: unitSelect.value,
          territory: territorySelect.value,
          retailName: selectedRetailer.retailName,
          retailPhone: selectedRetailer.retailPhone,
          disbursementDate: document.getElementById("disbursementDate").value,
          fileData: compressedBase64.split(",")[1],
          fileName: fileInput.files[0].name,
          mimeType: "image/jpeg"
        };

        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          showAlert("Disbursement submitted successfully!", "bg-emerald-100 text-emerald-800");

          // Locally remove disbursed shop from memory to update drop-down instantly
          const key = `${unitSelect.value}|${territorySelect.value}`;
          db.retailersMap[key] = db.retailersMap[key].filter(item => item.rowIndex !== selectedRetailer.rowIndex);

          populateRetailers(unitSelect.value, territorySelect.value);
          resetSubForm();
        } else {
          showAlert("Error: " + result.message, "bg-red-100 text-red-700");
        }
      } catch (err) {
        showAlert("Submission failed. Check internet connection.", "bg-red-100 text-red-700");
      } finally {
        setLoading(false);
      }
    });

    function resetSubForm() {
      retailSelect.value = "";
      itemCard.classList.add("hidden");
      fileInput.value = "";
      fileNameDisplay.textContent = "";
      selectedRetailer = null;
    }

    function showAlert(msg, classes) {
      alertBox.className = `p-4 text-sm font-medium text-center ${classes}`;
      alertBox.textContent = msg;
      alertBox.classList.remove("hidden");
      setTimeout(() => alertBox.classList.add("hidden"), 5000);
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        submitBtn.innerHTML = `<div class="loader border-2 border-white rounded-full w-5 h-5 mr-2"></div> Uploading...`;
      } else {
        submitBtn.innerHTML = `<span>Submit Disbursement</span>`;
      }
    }
  </script>
</body>
</html>
