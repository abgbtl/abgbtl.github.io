

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AkijBashir Form Portal</title>
  <style>
    html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#f8f9fa; font-family:'Segoe UI',Tahoma,sans-serif; }
    iframe { width:100%; height:100%; border:none; }
    .notice { max-width:560px; margin:80px auto; padding:26px; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.08); text-align:center; }
    .notice h2 { margin:0 0 12px; color:#1A365D; }
    .notice p { color:#555; line-height:1.5; }
    .notice a.btn { display:inline-block; margin-top:14px; padding:12px 22px; background:#1A365D; color:#fff; border-radius:8px; text-decoration:none; font-weight:600; }
  </style>
</head>
<body>

  <div id="adminNotice" class="notice" style="display:none;">
    <h2>Admin Panel</h2>
    <p>The Form Manager will open in a new tab. Sign in with a Google account that <b>owns</b> or <b>edits</b> the spreadsheet.</p>
    <a id="adminLink" class="btn" target="_blank" rel="noopener">Open Form Manager</a>
  </div>

  <iframe id="portalFrame" allow="camera"></iframe>

  <script>
    // PASTE YOUR APPS SCRIPT WEB APP URL HERE
    const APPS_SCRIPT_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyLTEzhcW-c06k4Khk5NMJRFsOjWIE-YZdLKyyU-yU5T03n1bhjTanYpf-DGjJAvqeMSw/exec";

    const params = new URLSearchParams(location.search);
    const route = (params.get('route') || 'user').toLowerCase();
    const formSlug = params.get('form') || '';
    const frame = document.getElementById('portalFrame');

    if (route === 'admin') {
      const adminUrl = APPS_SCRIPT_WEB_APP_URL + '?page=admin';
      frame.style.display = 'none';
      const notice = document.getElementById('adminNotice');
      notice.style.display = 'block';
      document.getElementById('adminLink').href = adminUrl;
      setTimeout(() => { try { window.open(adminUrl, '_blank', 'noopener'); } catch (e) {} }, 400);
    } else {
      // Public form: ?route=user&form=<slug>
      const qs = '?page=user' + (formSlug ? '&form=' + encodeURIComponent(formSlug) : '');
      frame.src = APPS_SCRIPT_WEB_APP_URL + qs;
    }
  </script>
</body>
</html>
